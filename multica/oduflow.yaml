apiVersion: oduflow.dev/v1alpha1
kind: Stack
metadata:
  name: multica
spec:
  databases:
    multica:
      cluster: prod

  volumes:
    multica-attachments:
      description: Multica uploaded attachments
    multica-machine-home:
      description: Private Machine identity, coding-tool credentials and workspaces

  services:
    multica-machine:
      # Prebuilt for Linux arm64 and amd64; no image build required at apply time.
      image: oduist/multica-runtime:0.11.0-2
      # Outbound-only daemon: no listener or health endpoint on this required port.
      port: 1
      hostname: multica-machine.localhost
      volumes:
        - source: multica-machine-home
          target: /home/node
          mode: rw

    multica-api:
      image: ghcr.io/multica-ai/multica-backend:v0.11.0
      port: 8080
      volumes:
        - source: multica-attachments
          target: /app/data/uploads
          mode: rw
      env:
        DATABASE_URL: {database: multica, databaseField: url}
        PORT: "8080"
        APP_ENV: production
        FRONTEND_ORIGIN: https://multica.example.com
        CORS_ALLOWED_ORIGINS: https://multica.example.com
        MULTICA_APP_URL: https://multica.example.com
        MULTICA_PUBLIC_URL: https://multica.example.com
        JWT_SECRET: secret:multica-jwt
        MULTICA_VCS_INTEGRATION_ENABLED: "true"
        MULTICA_VCS_SECRET_KEY: secret:multica-vcs
        ALLOW_SIGNUP: "false"
        ALLOWED_EMAILS: {fromEnv: MULTICA_ALLOWED_EMAILS}

    multica-web:
      image: ghcr.io/multica-ai/multica-web:v0.11.0
      hostname: multica.example.com
      port: 3000
      env:
        # The API container on the team network (team 1). Change the 1 for another team.
        REMOTE_API_URL: http://oduflow-1-svc-multica-api:8080
