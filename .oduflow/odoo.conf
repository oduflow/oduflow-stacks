[options]
; Base Odoo configuration for playground environments built from this repository.
; Same as Oduflow's default, except that demo data is loaded: customers, products and
; quotations to try things with right away.
addons_path = /mnt/extra-addons
list_db = False
without_demo = False
max_cron_threads = 0
limit_time_cpu = 600
limit_time_real = 1200
db_maxconn = 8
workers = 0
