apiVersion: oduflow.dev/v1alpha1
kind: Stack
metadata:
  name: multica
spec:
  production:
    name: multica-odoo
    domain: odoo.example.com
    repoUrl: https://github.com/oduflow/oduflow-stacks.git
    branch: main
    odooImage: odoo:19.0
    allowCopyToDevMcp: false

  databases:
    multica:
      cluster: prod

  volumes:
    multica-attachments:
      description: Multica uploaded attachments

  services:
    multica-api:
      image: ghcr.io/multica-ai/multica-backend:v0.10.0
      hostname: api.multica.example.com
      port: 8080
      volumes:
        - source: multica-attachments
          target: /app/data/uploads
          mode: rw
      env:
        DATABASE_URL: {database: multica, databaseField: url}
        PORT: "8080"
        APP_ENV: production
        FRONTEND_ORIGIN: https://app.multica.example.com
        CORS_ALLOWED_ORIGINS: https://app.multica.example.com
        COOKIE_DOMAIN: .multica.example.com
        MULTICA_APP_URL: https://app.multica.example.com
        MULTICA_PUBLIC_URL: https://api.multica.example.com
        JWT_SECRET: secret:multica-jwt
        MULTICA_VCS_INTEGRATION_ENABLED: "true"
        MULTICA_VCS_SECRET_KEY: secret:multica-vcs
        ALLOW_SIGNUP: "false"
        ALLOWED_EMAILS: {fromEnv: MULTICA_ALLOWED_EMAILS}
        SMTP_HOST: {fromEnv: MULTICA_SMTP_HOST}
        SMTP_PORT: {fromEnv: MULTICA_SMTP_PORT}
        SMTP_USERNAME: {fromEnv: MULTICA_SMTP_USERNAME}
        SMTP_PASSWORD: secret:multica-smtp
        SMTP_FROM_EMAIL: {fromEnv: MULTICA_SMTP_FROM_EMAIL}

    multica-web:
      image: ghcr.io/multica-ai/multica-web:v0.10.0
      hostname: app.multica.example.com
      port: 3000
      env:
        HOSTNAME: "0.0.0.0"
        REMOTE_API_URL: https://api.multica.example.com
        NEXT_PUBLIC_API_URL: https://api.multica.example.com
        NEXT_PUBLIC_WS_URL: wss://api.multica.example.com/ws
